    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            height: 100%; width: 100%; font-family: 'Segoe UI', system-ui, sans-serif;
            background: #060913; color: #e0f0ff; overflow: hidden;

        /* Fullscreen DKWIN background iframe */
        #mainApp { width: 100%; height: 100%; position: relative; display: none; }

        /* Draggable Cyberpunk Mini Hack Widget - Slim & Fully Grabbable */
        #hackWidget {

            background: linear-gradient(135deg, rgba(3, 20, 35, 0.96) 0%, rgba(2, 10, 20, 0.98) 100%);
            border: 2px solid #00ffff; border-radius: 16px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4), inset 0 0 12px rgba(0, 255, 255, 0.15);
            z-index: 9999; user-select: none; touch-action: none;
            backdrop-filter: blur(12px); padding: 8px;
            cursor: move; /* Indicates entire widget is draggable */
        }

        /* Widget Header */
        .widget-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 2px 2px 6px 2px; border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            font-weight: 900; font-size: 10px; color: #00ffff;
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.8); letter-spacing: 0.5px;

        /* Status Bar */
        .status-bar {
            display: flex; justify-content: space-between; align-items: center;

        }
        .status-bar .live-dot {
            width: 5px; height: 5px; background: #00ff66; border-radius: 50%;
            display: inline-block; box-shadow: 0 0 6px #00ff66; margin-right: 3px;

        /* Signal Section (Slanted Badge + Number Orb) */
        .signal-container {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0, 15, 30, 0.6); border: 1px solid rgba(0, 255, 255, 0.35);
            border-radius: 12px; padding: 6px 8px; margin: 3px 0;
            box-shadow: inset 0 0 10px rgba(0, 255, 255, 0.1);

        /* Slanted Pill Badge for BIG / SMALL */
        .slanted-pill {
            background: linear-gradient(135deg, #0b1a2d 0%, #153254 100%);

            padding: 5px 10px; transform: skewX(-6deg);
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.4);
            display: flex; align-items: center; justify-content: center;

        .slanted-pill span {
            transform: skewX(6deg); font-size: 18px; font-weight: 900;
            letter-spacing: 1.5px; color: #ffffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
        }

        /* Glowing Number Orb on the right */
        .number-orb-wrap {
            position: relative; width: 42px; height: 42px;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle, rgba(0,255,255,0.2) 0%, rgba(138,43,226,0.3) 100%);
            border-radius: 50%; border: 1.5px solid #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5), inset 0 0 6px rgba(0, 255, 255, 0.3);
        }
        .number-orb-inner {
            width: 30px; height: 30px; background: #050b14; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 900; color: #ccff00;
            box-shadow: 0 0 6px rgba(204, 255, 0, 0.8);
            border: 1px solid #ccff00;
        }

        /* Period & Countdown Row */
        .period-row {
            text-align: center; margin: 4px 0; font-size: 10px; font-weight: 800;
            color: #e0f0ff; letter-spacing: 0.5px; display: flex; justify-content: center; align-items: center; gap: 4px;

        .period-row span.brackets { color: #00ffff; font-size: 11px; }
        .countdown-text { font-size: 8px; color: #ccff00; text-align: center; margin-bottom: 3px; font-weight: bold; }

        /* Action Buttons Row (AGAIN & HIDE) */
        .btn-row { display: flex; gap: 5px; margin-bottom: 5px; }
        .cyber-action-btn {
            flex: 1; padding: 6px 0; background: linear-gradient(90deg, rgba(0,120,200,0.6), rgba(0,255,255,0.4));
            border: 1px solid #00ffff; border-radius: 16px; color: #ffffff; font-weight: 800; font-size: 9px;
            cursor: pointer; text-transform: uppercase; text-align: center;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.3); transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 3px; text-decoration: none;
        }
        .cyber-action-btn:hover { background: rgba(0, 255, 255, 0.3); transform: scale(1.02); }

        /* JOIN NOW Bottom Button */
        .join-now-btn {
            width: 100%; padding: 7px 0; background: linear-gradient(90deg, #00ffff, #8a2be2);
            border: 1px solid #00ffff; border-radius: 16px; color: #050b14; font-weight: 900; font-size: 10px;
            cursor: pointer; text-transform: uppercase; text-align: center; text-decoration: none;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.5); display: block; letter-spacing: 0.5px; transition: 0.2s;
        }
        .join-now-btn:hover { opacity: 0.95; transform: scale(1.02); }

        /* Password Login Overlay Inside Widget */
        #passwordOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 10, 20, 0.98); backdrop-filter: blur(15px);
            border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 12px; z-index: 10000; text-align: center;
        }
        #passwordOverlay h3 { color: #00ffff; font-size: 11px; margin-bottom: 3px; letter-spacing: 0.5px; }
        #passwordOverlay p { font-size: 8px; color: #8ab4f8; margin-bottom: 8px; }
        .pass-input {
            width: 100%; padding: 6px; background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.6); border-radius: 6px;
            color: #fff; font-size: 11px; text-align: center; margin-bottom: 6px; outline: none; letter-spacing: 2px;
        }
        .pass-btn {
            width: 100%; padding: 6px; background: linear-gradient(90deg, #00ffff, #8a2be2);
            border: none; border-radius: 6px; color: #050b14; font-weight: 900; font-size: 10px; cursor: pointer;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.5);
        }
        .pass-error { color: #ff2a5e; font-size: 8px; margin-top: 5px; display: none; }

        /* Server Offline Maintenance Overlay */
        #maintenanceOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.95); display: none; flex-direction: column;
            align-items: center; justify-content: center; z-index: 99999; text-align: center; padding: 20px;
        }
        #maintenanceOverlay h2 { color: #ff3333; font-size: 22px; margin-bottom: 8px; text-shadow: 0 0 12px #ff3333; }
        #maintenanceOverlay p { color: #8ab4f8; font-size: 12px; }

        /* Floating Ball when Minimized (Draggable too) */
        #floatingBall {
            position: fixed; bottom: 25px; right: 25px; width: 48px; height: 48px;
            background: radial-gradient(circle, #00ffff 0%, #8a2be2 100%);
            border-radius: 50%; display: none; align-items: center; justify-content: center;
            box-shadow: 0 0 18px rgba(0,255,255,0.9); cursor: grab; z-index: 99999;
            font-size: 20px; animation: pulseBall 1.5s infinite; touch-action: none;
        }
        #floatingBall:active { cursor: grabbing; }
        @keyframes pulseBall {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(0,255,255,0.6); }
            50% { transform: scale(1.12); box-shadow: 0 0 22px rgba(0,255,255,1); }
            100% { transform: scale(1); box-shadow: 0 0 10px rgba(0,255,255,0.6); }
        }
    </style>
</head>
<body>

    <!-- Server Maintenance Screen -->
    <div id="maintenanceOverlay">
        <h2>⚠️ SERVER OFFLINE / MAINTENANCE</h2>
        <p>Admin has temporarily turned off the server. Please try again later.</p>
    </div>

    <div id="mainApp">
        <!-- DKWIN registration iframe with updated link and invitation code -->
        <iframe src="https://dkwin1.com/#/register?invitationCode=518181607305"></iframe>

        <!-- DRAGGABLE MINI HACK WIDGET -->
        <div id="hackWidget">
            <!-- Password Protection Overlay -->
            <div id="passwordOverlay">
                <h3>『 ALPHA DEVELOPER ASM 』</h3>
                <p>ENTER PASSWORD FROM ADMIN PANEL</p>
                <input type="password" id="passInput" class="pass-input" placeholder="ENTER PASSWORD">
                <button class="pass-btn" onclick="verifyPassword()">UNLOCK PANEL</button>
                <div id="passError" class="pass-error">❌ Invalid or Expired Password!</div>
            </div>

            <!-- Widget Header -->
            <div class="widget-header">
                <span>『 ALPHA DEVELOPER ASM 』</span>
                <span id="headerTimer" style="color: #ccff00;">00:30</span>
            </div>

            <div class="widget-body">
                <!-- Status Bar -->
                <div class="status-bar">
                    <div><span class="live-dot"></span>LIVE</div>
                    <div>MOD : ON</div>
                    <div>PING : 12MS</div>
                </div>

                <!-- Signal Display (Slanted Big/Small + Number Orb) -->
                <div class="signal-container">
                    <div class="slanted-pill">
                        <span id="predText">BIG</span>
                    </div>
                    <div class="number-orb-wrap">
                        <div id="numberOrb" class="number-orb-inner">5</div>
                    </div>
                </div>

                <!-- Countdown seconds display -->
                <div id="countdownSeconds" class="countdown-text">13 S</div>

                <!-- Period Display -->
                <div class="period-row">
                    <span class="brackets">⟨⟨</span>
                    <span id="periodDisplay">PERIOD : ---</span>
                    <span class="brackets">⟩⟩</span>
                </div>

                <!-- Buttons Row -->
                <div class="btn-row">
                    <button class="cyber-action-btn" onclick="forceRefresh()">
                        <span>↺</span> AGAIN
                    </button>
                    <button class="cyber-action-btn" onclick="hideWidget()">
                        <span>👁️</span> HIDE
                    </button>
                </div>

                <!-- Join Now Telegram Button -->
                <a href="https://t.me/paymentusdt00" target="_blank" class="join-now-btn">
                    » 🕷️ JOIN NOW «
                </a>
            </div>
        </div>
    </div>

    <!-- Floating Ball when Minimized -->
    <div id="floatingBall" onclick="handleBallClick()" title="Open Hack">⚡</div>

<script>
    const DB_URL = "https://wingo30s1-default-rtdb.firebaseio.com/";
    const userId = "user_" + Math.random().toString(36).substring(2, 9);
    let audioUnlocked = false;

    window.onload = () => {
        checkServerState();
        setInterval(checkServerState, 3000);
        setInterval(sendHeartbeat, 10000);
    };

    // Excited AI Girl Voice for Win + Win Sound, Simple Loss Sound for Loss
    function handleResultFeedback(isWin) {
        if (!audioUnlocked) return;
        
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            
            if (isWin) {
                // Excited Win Sound (Chime / Arpeggio effect)
                let now = ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                    let osc = ctx.createOscillator();
                    let gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, now + index * 0.08);
                    gain.gain.setValueAtTime(0.1, now + index * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.08 + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now + index * 0.08);
                    osc.stop(now + index * 0.08 + 0.2);
                });

                // Excited AI Girl Voice
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance("Awesome! Win!");
                    utterance.rate = 1.2; // Faster, more excited
                    utterance.pitch = 1.6; // Higher excited pitch
                    utterance.volume = 1.0;
                    
                    const voices = window.speechSynthesis.getVoices();
                    const femaleVoice = voices.find(v => v.name.includes('Female') || v.name.includes('Zira') || v.name.includes('Google UK English Female') || v.name.includes('Samantha') || v.name.includes('Victoria'));
                    if (femaleVoice) {
                        utterance.voice = femaleVoice;
                    }
                    window.speechSynthesis.speak(utterance);
                }
            } else {
                // Simple subtle loss sound (soft low click/beep)
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, ctx.currentTime);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            }
        } catch(e) {}
    }

    async function checkServerState() {
        try {
            const res = await fetch(`${DB_URL}/serverStatus.json`);
            let state = await res.json();
            if(state === false) {
                document.getElementById('maintenanceOverlay').style.display = 'flex';
                document.getElementById('mainApp').style.display = 'none';
            } else {
                document.getElementById('maintenanceOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            }
        } catch(e){}
    }

    async function sendHeartbeat() {
        try {
            await fetch(`${DB_URL}/liveUsers/${userId}.json`, {
                method: 'PUT',
                body: JSON.stringify(Date.now())
            });
        } catch(e){}
    }

    async function verifyPassword() {
        const inputPass = document.getElementById('passInput').value.trim();
        if(!inputPass) return;

        audioUnlocked = true;
        if ('speechSynthesis' in window) {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
        }

        try {
            const resMain = await fetch(`${DB_URL}/mainPassword.json`);
            const mainPass = await resMain.json();
            if(mainPass && inputPass === mainPass) {
                unlockSuccess();
                return;
            }

            const resTemp = await fetch(`${DB_URL}/tempPasswords/${inputPass}.json`);
            const tempObj = await resTemp.json();
            
            if(tempObj && tempObj.expiresAt && Date.now() < tempObj.expiresAt) {
                unlockSuccess();
            } else {
                document.getElementById('passError').style.display = 'block';
            }
        } catch(e) {
            document.getElementById('passError').style.display = 'block';
        }
    }

    function unlockSuccess() {
        document.getElementById('passwordOverlay').style.display = 'none';
        startEngine();
    }

    document.getElementById('passInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') verifyPassword();
    });

    // -------------------------------------------------------------------------
    // FULLY DRAGGABLE WIDGET & FLOATING BALL LOGIC (Grab anywhere on widget)
    // -------------------------------------------------------------------------
    const widget = document.getElementById('hackWidget');
    const ball = document.getElementById('floatingBall');
    let isDragging = false, startX, startY, initialX, initialY, hasMoved = false;

    // Make widget draggable from anywhere inside it
    widget.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', dragEnd);

    widget.addEventListener('touchstart', dragStart, {passive: false});
    document.addEventListener('touchmove', drag, {passive: false});
    document.addEventListener('touchend', dragEnd);

    // Make floating ball draggable too
    ball.addEventListener('mousedown', dragStartBall);
    ball.addEventListener('touchstart', dragStartBall, {passive: false});

    function dragStart(e) {
        // Do not trigger drag if clicking input or buttons inside widget
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'A') return;
        isDragging = true;
        hasMoved = false;
        startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
        initialX = widget.offsetLeft;
        initialY = widget.offsetTop;
    }

    function dragStartBall(e) {
        isDragging = true;
        hasMoved = false;
        startX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
        startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
        initialX = ball.offsetLeft;
        initialY = ball.offsetTop;
    }

    function drag(e) {
        if (!isDragging) return;
        e.preventDefault();
        hasMoved = true;
        let currentX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
        let currentY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;
        
        let dx = currentX - startX;
        let dy = currentY - startY;

        if (ball.style.display === 'flex') {
            ball.style.left = (initialX + dx) + 'px';
            ball.style.top = (initialY + dy) + 'px';
            ball.style.bottom = 'auto';
            ball.style.right = 'auto';
        } else {
            widget.style.left = (initialX + dx) + 'px';
            widget.style.top = (initialY + dy) + 'px';
        }
    }

    function dragEnd() {
        isDragging = false;
    }

    function hideWidget() {
        widget.style.display = 'none';
        ball.style.display = 'flex';
        ball.style.bottom = '30px';
        ball.style.right = '30px';
        ball.style.left = 'auto';
        ball.style.top = 'auto';
    }

    function showWidget() {
        ball.style.display = 'none';
        widget.style.display = 'block';
    }

    function handleBallClick() {
        if (!hasMoved) {
            showWidget();
        }
    }

    // -------------------------------------------------------------------------
    // WINGO 30S ENGINE & PREDICTION LOGIC
    // -------------------------------------------------------------------------
    const API = "https://draw.ar-lottery01.com/WinGo/WinGo_30S/GetHistoryIssuePage.json";
    let lastProcessedPeriod = null;
    let lastPredictedSignal = null;

    function startEngine() {
        updateClock();
        fetchSignal();
        setInterval(updateClock, 1000);
        setInterval(fetchSignal, 2000);
    }

    function updateClock() {
        let sec = new Date().getSeconds();
        let rem = 30 - (sec % 30);
        if (rem === 30) rem = 0;
        
        let formatted = `00:${rem < 10 ? '0' + rem : rem}`;
        document.getElementById('headerTimer').innerText = formatted;
        document.getElementById('headerTimer').style.color = rem <= 5 ? "#ff10f0" : "#ccff00";
        document.getElementById('countdownSeconds').innerText = rem + " S";
    }

    async function fetchSignal() {
        try {
            const res = await fetch(API + '?t=' + Date.now());
            const data = await res.json();
            const list = data.data.list;
            const topItem = list[0];
            
            if (lastProcessedPeriod && lastProcessedPeriod !== topItem.issueNumber && lastPredictedSignal) {
                const actualNum = parseInt(topItem.number);
                const actualSignal = actualNum >= 5 ? "BIG" : "SMALL";
                const isWin = (actualSignal === lastPredictedSignal);
                
                handleResultFeedback(isWin);
                lastPredictedSignal = null;
            }

            processPrediction(topItem.issueNumber, list);
        } catch (err) {}
    }

    function forceRefresh() {
        fetchSignal();
    }

    function processPrediction(currentIssue, list) {
        if (lastProcessedPeriod !== currentIssue) {
            lastProcessedPeriod = currentIssue;
            let nextPeriod = (BigInt(currentIssue) + 1n).toString();
            
            const last5 = list.slice(0, 5).map(x => parseInt(x.number) >= 5 ? "BIG" : "SMALL");
            const lastNums = list.slice(0, 5).map(x => parseInt(x.number));
            
            let predicted = (last5[0] === last5[1] && last5[1] === last5[2]) ? last5[0] : (last5[0] === "BIG" ? "SMALL" : "BIG");
            lastPredictedSignal = predicted;

            let sum = lastNums.reduce((a, b) => a + b, 0);
            
            let targetNum;
            if (predicted === "BIG") {
                let bigNums = [5, 6, 7, 8, 9];
                targetNum = bigNums[sum % bigNums.length];
            } else {
                let smallNums = [0, 1, 2, 3, 4];
                targetNum = smallNums[sum % smallNums.length];
            }
            
            document.getElementById('periodDisplay').innerText = "PERIOD : " + nextPeriod.slice(-4);
            document.getElementById('predText').innerText = predicted;
            document.getElementById('predText').style.color = predicted === "BIG" ? "#00ffff" : "#ccff00";
            document.getElementById('numberOrb').innerText = targetNum;
        }
    }
</script>
</body>
